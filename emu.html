<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruti Player</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #f3f5f8; font-family: "Segoe UI", Roboto, Inter, system-ui, sans-serif; }
    #game { width: 100%; height: 100%; }
    .msg { height: 100%; display: grid; place-items: center; align-content: center; gap: 14px; color: #8d95a5; padding: 16px; box-sizing: border-box; text-align: center; }
    .msg b { color: #f3f5f8; font-size: 18px; }
    .bar { width: min(360px, 80vw); height: 8px; border-radius: 4px; background: #232934; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: #29b6f6; transition: width .2s; }
    .msg .eta, #eta { color: #f3f5f8; font-size: 15px; }
    /* Time left while the emulator unpacks / loads (shown under its own progress text) */
    #eta { position: fixed; left: 0; right: 0; bottom: 18%; text-align: center; z-index: 9999; pointer-events: none;
           text-shadow: 0 1px 4px #000; }
    #eta small { display: block; color: #8d95a5; font-size: 12px; margin-top: 4px; }
    /* Back to the library. Fades out while playing; moving the mouse brings it back. */
    #back { position: fixed; top: 12px; left: 12px; z-index: 10000; display: flex; align-items: center; gap: 6px;
            padding: 8px 14px 8px 10px; border-radius: 8px; background: rgba(12,14,18,.8); border: 1px solid rgba(255,255,255,.12);
            color: #f3f5f8; font: 600 14px "Segoe UI", Roboto, Inter, system-ui, sans-serif; text-decoration: none; transition: opacity .3s; }
    #back:hover { background: rgba(41,182,246,.9); color: #0d1015; }
    #back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    body.playing #back, body.playing #keysBtn { opacity: 0; pointer-events: none; }
    body.playing.mouse #keysBtn { opacity: 1; pointer-events: auto; }
    body.touch.playing #back { opacity: .5; pointer-events: auto; padding: 6px 12px 6px 8px; }
    /* Touch screens: the on-screen L / R buttons sit in the top corners, so the Library button goes in the middle */
    body.touch #back { left: 50%; transform: translateX(-50%); top: 8px; }
    body.touch #keysBtn, body.touch #keys { display: none !important; }
    #keysBtn { position: fixed; top: 12px; left: 132px; z-index: 10000; padding: 8px 14px; border-radius: 8px; cursor: pointer;
               background: rgba(12,14,18,.8); border: 1px solid rgba(255,255,255,.12); color: #f3f5f8;
               font: 600 14px "Segoe UI", Roboto, Inter, system-ui, sans-serif; transition: opacity .3s; }
    #keysBtn:hover { background: rgba(41,182,246,.9); color: #0d1015; }
    #keys { position: fixed; top: 58px; left: 12px; z-index: 10001; width: min(360px, calc(100vw - 24px)); padding: 14px 16px 12px;
            border-radius: 10px; background: rgba(12,14,18,.94); border: 1px solid rgba(255,255,255,.14); color: #f3f5f8;
            font: 14px/1.4 "Segoe UI", Roboto, Inter, system-ui, sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
    #keys h3 { margin: 0 0 8px; font-size: 15px; }
    #keys table { width: 100%; border-collapse: collapse; }
    #keys td { padding: 3px 0; }
    #keys td:last-child { text-align: right; }
    #keys kbd { display: inline-block; min-width: 22px; padding: 1px 7px; border-radius: 5px; background: #252b36; border: 1px solid #3a4352;
                font: 600 12px ui-monospace, monospace; text-align: center; }
    #keys p { margin: 8px 0 0; color: #8d95a5; font-size: 12px; }
    /* Browsers only allow sound after a click or key press on this page. Some games (often PSP)
       wait for sound and freeze without it, so ask for one click when needed. */
    #tap { position: fixed; inset: 0; z-index: 9998; display: grid; place-items: center; align-content: center; gap: 14px;
           background: rgba(0,0,0,.6); color: #f3f5f8; cursor: pointer; text-align: center; padding: 16px;
           font-family: "Segoe UI", Roboto, Inter, system-ui, sans-serif; }
    #tap .big { display: flex; align-items: center; gap: 12px; padding: 16px 30px 16px 24px; border-radius: 10px; background: #2fb347;
                font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    #tap .big svg { width: 22px; height: 22px; fill: currentColor; }
    #tap small { color: #c3c9d4; font-size: 14px; }
    body.playing.mouse #back { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <a id="back" href="index.html" title="Back to the library"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Library</a>
  <button id="keysBtn" hidden title="Which keys to press">Controls</button>
  <div id="keys" hidden></div>
  <div id="game"><div class="msg">Loading…</div></div>
  <script src="consoles.js?v=12"></script>
  <script src="games.js?v=10"></script>
  <script src="library.js?v=17"></script>
  <script>
    // Console player (EmulatorJS). emu.html?game=rom/<Console>/<Game Name>
    // Only games found in the repo's rom/ folder can be played.
    (function () {
      var stage = document.getElementById("game");
      var id = new URLSearchParams(location.search).get("game") || "";
      var show = function (title, text) {
        stage.innerHTML = '<div class="msg"><b></b><span></span></div>';
        stage.querySelector("b").textContent = title;
        stage.querySelector("span").textContent = text || "";
      };
      var mb = function (n) { return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB"; };

      // "about 1 min 20 s left"
      function timeLeft(sec) {
        if (!isFinite(sec) || sec < 0) return "";
        if (sec < 5) return "a few seconds left";
        if (sec < 60) return "about " + Math.ceil(sec / 5) * 5 + " seconds left";
        var m = Math.floor(sec / 60), s = Math.round((sec % 60) / 10) * 10;
        if (s === 60) { m++; s = 0; }
        if (m >= 10) return "about " + Math.round(sec / 60) + " minutes left";
        return "about " + m + " min" + (s ? " " + s + " s" : "") + " left";
      }

      // Estimates time left from the average speed since this step began (steadier than the
      // latest speed). Waits a few seconds so the first guess isn't wild, and only lets the
      // number go up again when it's clearly wrong, so it doesn't jump around.
      function Eta() {
        var t0 = 0, p0 = 0, lastP = 0, shown = Infinity;
        return function (p) {                 // p = progress from 0 to 1
          var now = performance.now();
          if (!t0 || p < lastP) { t0 = now; p0 = lastP = p; shown = Infinity; return "Working out the time left…"; }
          lastP = p;
          var rate = (p - p0) / (now - t0);
          if (now - t0 < 3000 || rate <= 0) return "Working out the time left…";
          var left = (1 - p) / rate / 1000;
          if (left < shown || left > shown * 1.3) shown = left; else shown = Math.max(0, shown - 0.25);
          return timeLeft(shown);
        };
      }

      // EmulatorJS shows its own text while it downloads the core and unpacks the game
      // ("Decompress Game Data 34%"). Watch it and add the time left underneath.
      // If the emulator fails before the game starts (usually: too big to unpack in the browser), say so plainly
      function explainFailure(g) {
        var shown = false;
        var fail = function () {
          var emu = window.EJS_emulator;
          if (shown || (emu && emu.started)) return;
          shown = true;
          var big = g.console === "psp" ? " Try again, or close other tabs first. If it keeps failing, the game may be too big for this " +
            "computer's browser to unpack: uploading it as .cso parts instead needs much less memory." : "";
          show(g.title, "The game couldn't be loaded. The browser may have run out of memory while unpacking it, or a file may be damaged." + big);
          document.body.classList.remove("playing");
        };
        addEventListener("error", function (e) { if (/abort/i.test(String(e.message || ""))) fail(); });
        addEventListener("unhandledrejection", function (e) { if (/abort/i.test(String(e.reason && (e.reason.message || e.reason)))) fail(); });
        var check = setInterval(function () { var emu = window.EJS_emulator; if (emu && emu.failedToStart) { clearInterval(check); fail(); } if (emu && emu.started) clearInterval(check); }, 1000);
      }

      // Which keyboard keys are which buttons (EmulatorJS's default keys), per console
      var K = { z: "Z", x: "X", a: "A", s: "S", q: "Q", e: "E", enter: "Enter", v: "V", tab: "Tab", r: "R", arrows: "Arrow keys", stick: "T F G H" };
      var CONTROLS = {
        nds:    [["A", K.z], ["B", K.x], ["X", K.a], ["Y", K.s], ["L / R", K.q + " / " + K.e], ["Start", K.enter], ["Select", K.v], ["D-pad", K.arrows], ["Touch screen", "Mouse"]],
        gba:    [["A", K.z], ["B", K.x], ["L / R", K.q + " / " + K.e], ["Start", K.enter], ["Select", K.v], ["D-pad", K.arrows]],
        gb:     [["A", K.z], ["B", K.x], ["Start", K.enter], ["Select", K.v], ["D-pad", K.arrows]],
        nes:    [["A", K.z], ["B", K.x], ["Start", K.enter], ["Select", K.v], ["D-pad", K.arrows]],
        snes:   [["A", K.z], ["B", K.x], ["X", K.a], ["Y", K.s], ["L / R", K.q + " / " + K.e], ["Start", K.enter], ["Select", K.v], ["D-pad", K.arrows]],
        segaMD: [["A", K.s], ["B", K.x], ["C", K.z], ["Start", K.enter], ["D-pad", K.arrows]],
        psx:    [["Move (left stick)", "W A S D"], ["✕ Cross", "K"], ["○ Circle", "L"], ["□ Square", "J"], ["△ Triangle", "I"], ["L1 / R1", "Q / E"], ["L2 / R2", "1 / 3"], ["Start", K.enter], ["Select", K.v], ["D-pad", K.arrows]],
        psp:    [["Move (analog stick)", "W A S D"], ["✕ Cross", "K"], ["○ Circle", "L"], ["□ Square", "J"], ["△ Triangle", "I"], ["L / R (camera, aim)", "Q / E"], ["D-pad", K.arrows], ["Start", K.enter], ["Select", K.v]],
        segaMS: [["1", K.x], ["2", K.z], ["Pause / Start", K.enter], ["D-pad", K.arrows]],
        segaGG: [["1", K.x], ["2", K.z], ["Start", K.enter], ["D-pad", K.arrows]],
        sega32x: [["A", K.s], ["B", K.x], ["C", K.z], ["X / Y / Z", "A / Q / E"], ["Start", K.enter], ["Mode", K.v], ["D-pad", K.arrows]],
        segaSaturn: [["A", K.s], ["B", K.x], ["C", K.z], ["X / Y / Z", "A / Q / E"], ["L / R", K.tab + " / " + K.r], ["Start", K.enter], ["D-pad", K.arrows]],
        atari2600: [["Fire", K.x], ["Reset", K.enter], ["Select", K.v], ["Joystick", K.arrows]],
        atari7800: [["Button 1", K.x], ["Button 2", K.z], ["Pause", K.enter], ["Select", K.v], ["Joystick", K.arrows]],
        jaguar: [["A / B / C", "S / X / Z"], ["Pause", K.enter], ["Option", K.v], ["D-pad", K.arrows]],
        ngp:    [["A", K.z], ["B", K.x], ["Option", K.enter], ["Stick", K.arrows]],
        ws:     [["A", K.z], ["B", K.x], ["Start", K.enter], ["X pad", K.arrows], ["Y pad", "I J K L (in emulator menu)"]],
        vb:     [["A", K.z], ["B", K.x], ["Start", K.enter], ["Select", K.v], ["Left pad", K.arrows], ["L / R", K.q + " / " + K.e]],
        pce:    [["I", K.z], ["II", K.x], ["Run", K.enter], ["Select", K.v], ["D-pad", K.arrows]],
        n64:    [["Move (stick)", "W A S D"], ["Look around (C buttons)", "I J K L"], ["A", "Space"], ["B", "Shift"], ["Z trigger", "Z"], ["L / R", "Q / E"], ["Start", K.enter], ["D-pad", K.arrows]]
      };
      function setUpControls(g) {
        var rows = CONTROLS[g.console];
        if (!rows || touch) return;
        var panel = document.getElementById("keys"), btn = document.getElementById("keysBtn");
        panel.innerHTML = "<h3>Controls</h3><table></table><p>A gamepad works too. Keys can be changed in the emulator's own menu (the gamepad icon at the bottom of the game).</p>";
        var t = panel.querySelector("table");
        rows.forEach(function (r) {
          var tr = document.createElement("tr"), a = document.createElement("td"), b = document.createElement("td");
          a.textContent = r[0];
          if (/ /.test(r[1]) && !/ \/ |Arrow|^[A-Z]( [A-Z]){3}$/.test(r[1])) b.textContent = r[1];
          else r[1].split(" / ").forEach(function (k, i) { if (i) b.appendChild(document.createTextNode(" / ")); var kb = document.createElement("kbd"); kb.textContent = k; b.appendChild(kb); });
          tr.appendChild(a); tr.appendChild(b); t.appendChild(tr);
        });
        btn.hidden = false;
        btn.onclick = function () { panel.hidden = !panel.hidden; };
        // Show the panel by itself the first time someone plays a console
        var key = "fruti:controls-seen:" + g.console;
        var seen = false; try { seen = !!localStorage.getItem(key); localStorage.setItem(key, "1"); } catch (e) {}
        if (!seen) { panel.hidden = false; setTimeout(function () { panel.hidden = true; }, 15000); }
      }

      // Once the game runs, hide the Library button until the mouse moves
      function backButtonWhilePlaying() {
        var hideTimer;
        var check = setInterval(function () {
          if (window.EJS_emulator && window.EJS_emulator.started) { clearInterval(check); document.body.classList.add("playing"); }
        }, 500);
        addEventListener("mousemove", function () {
          document.body.classList.add("mouse");
          clearTimeout(hideTimer); hideTimer = setTimeout(function () { document.body.classList.remove("mouse"); }, 2500);
        });
      }

      function watchEmulatorProgress() {
        var box = document.createElement("div"); box.id = "eta"; document.body.appendChild(box);
        var steps = {}, timer = setInterval(function () {
          var el = document.querySelector(".ejs_loading_text");
          var emu = window.EJS_emulator;
          if (!el || (emu && emu.started) || (emu && emu.failedToStart)) { box.textContent = ""; if (emu && (emu.started || emu.failedToStart)) { clearInterval(timer); box.remove(); } return; }
          var m = /^(.*?)\s*(\d+)%/.exec(el.innerText || "");
          if (!m) { box.textContent = ""; return; }
          var step = m[1], est = steps[step] || (steps[step] = Eta());
          var label = /game data/i.test(step) ? "Unpacking the game" : /core/i.test(step) ? "Getting the emulator ready" : "Loading";
          var left = est(+m[2] / 100);
          box.innerHTML = "";
          box.appendChild(document.createTextNode(left));
          var small = document.createElement("small"); small.textContent = label + ". Big games take longer here; please keep this tab open.";
          box.appendChild(small);
        }, 250);
      }

      function loadScript(src) {
        return new Promise(function (ok, fail) {
          var s = document.createElement("script");
          s.src = src; s.onload = ok; s.onerror = function () { fail(new Error("Could not load " + src)); };
          document.head.appendChild(s);
        });
      }

      // Phones and tablets: the emulator shows on-screen buttons by itself
      var touch = window.matchMedia("(pointer: coarse)").matches;   // finger is the main pointer (not touchscreen laptops)
      if (touch) document.body.classList.add("touch");

      // PSP on-screen buttons: the emulator's default layout has no L/R and labels them like a
      // Nintendo pad, so give it a real PSP layout (analog stick + D-pad on the left, like its N64 one)
      var PSP_TOUCH = [
        { type: "button", text: "\u25B3", id: "triangle", location: "right", left: 40, bold: true, input_value: 9 },
        { type: "button", text: "\u25A1", id: "square", location: "right", top: 40, bold: true, input_value: 1 },
        { type: "button", text: "\u25CB", id: "circle", location: "right", left: 81, top: 40, bold: true, input_value: 8 },
        { type: "button", text: "\u2715", id: "cross", location: "right", left: 40, top: 80, bold: true, input_value: 0 },
        { type: "zone", id: "stick", location: "left", left: "50%", top: "100%", joystickInput: true, inputValues: [16, 17, 18, 19] },
        { type: "zone", id: "dpad", location: "left", left: "50%", top: "0%", joystickInput: false, inputValues: [4, 5, 6, 7] },
        { type: "button", text: "Start", id: "start", location: "center", left: 60, fontSize: 15, block: true, input_value: 3 },
        { type: "button", text: "Select", id: "select", location: "center", left: -5, fontSize: 15, block: true, input_value: 2 },
        { type: "button", text: "L", id: "l", location: "left", left: 3, top: -100, bold: true, block: true, input_value: 10 },
        { type: "button", text: "R", id: "r", location: "right", right: 3, top: -100, bold: true, block: true, input_value: 11 }
      ];

      // Keyboard keys. EmulatorJS's defaults put the analog stick on T/F/G/H, which makes moving and
      // looking around in 3D games (PSP, PS1, N64) awkward, so those get PC-game style keys:
      // W A S D = stick, arrow keys = D-pad, I J K L = the face buttons (PSP/PS1) or C buttons / camera (N64).
      var PAD = ["BUTTON_2", "BUTTON_4", "SELECT", "START", "DPAD_UP", "DPAD_DOWN", "DPAD_LEFT", "DPAD_RIGHT", "BUTTON_1", "BUTTON_3",
        "LEFT_TOP_SHOULDER", "RIGHT_TOP_SHOULDER", "LEFT_BOTTOM_SHOULDER", "RIGHT_BOTTOM_SHOULDER", "LEFT_STICK", "RIGHT_STICK",
        "LEFT_STICK_X:+1", "LEFT_STICK_X:-1", "LEFT_STICK_Y:+1", "LEFT_STICK_Y:-1", "RIGHT_STICK_X:+1", "RIGHT_STICK_X:-1", "RIGHT_STICK_Y:+1", "RIGHT_STICK_Y:-1"];
      var KEYS_2D = ["x", "s", "v", "enter", "up arrow", "down arrow", "left arrow", "right arrow", "z", "a", "q", "e", "tab", "r", "", "", "h", "f", "g", "t", "l", "j", "k", "i"];
      var KEYS = {
        //       ✕ / B   □ / Y   Select  Start    D-pad up      down          left          right          ○ / A  △ / X  L    R    L2     R2   L3  R3  stick right left down up   right stick
        psp:    ["k",    "j",    "v",    "enter", "up arrow",   "down arrow", "left arrow", "right arrow", "l",   "i",   "q", "e", "",    "",  "", "", "d", "a", "s", "w", "", "", "", ""],
        psx:    ["k",    "j",    "v",    "enter", "up arrow",   "down arrow", "left arrow", "right arrow", "l",   "i",   "q", "e", "1",   "3", "", "", "d", "a", "s", "w", "", "", "", ""],
        //       A        B        -     Start    D-pad                                                    -     -      L    R    Z                    stick                C buttons (camera)
        n64:    ["space", "shift", "",   "enter", "up arrow",   "down arrow", "left arrow", "right arrow", "",    "",    "q", "e", "z",   "",  "", "", "d", "a", "s", "w", "l", "j", "k", "i"]
      };
      function controlsFor(con) {
        var keys = KEYS[con] || KEYS_2D, p1 = {}, empty = {};
        keys.forEach(function (k, i) { p1[i] = { value: k, value2: PAD[i] }; });
        return { 0: p1, 1: empty, 2: empty, 3: empty };
      }

      // Keep track of the emulator's sound so one click or key press can switch it on
      var audioContexts = [];
      ["AudioContext", "webkitAudioContext"].forEach(function (name) {
        var Base = window[name];
        if (!Base) return;
        window[name] = class extends Base { constructor(a) { super(a); audioContexts.push(this); } };
      });
      function soundOn() { audioContexts.forEach(function (c) { if (c.state !== "running" && c.state !== "closed") c.resume().catch(function () {}); }); }
      addEventListener("pointerdown", soundOn, true);
      addEventListener("keydown", soundOn, true);

      // Once the game runs: if sound is still blocked, show "Click to play"
      function askForClickIfNeeded(g) {
        var check = setInterval(function () {
          var emu = window.EJS_emulator;
          if (!emu || !emu.started) return;
          clearInterval(check);
          setTimeout(function () {
            if (!audioContexts.some(function (c) { return c.state === "suspended"; })) return;
            var tap = document.createElement("div"); tap.id = "tap";
            tap.innerHTML = '<div class="big"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>' + (touch ? "Tap to play" : "Click to play") + '</div><small></small>';
            tap.querySelector("small").textContent = g.title + " is ready. Your browser needs one " + (touch ? "tap" : "click (or any key)") + " to turn on the sound.";
            document.body.appendChild(tap);
            var go = function () { soundOn(); tap.remove(); removeEventListener("keydown", go, true); };
            tap.addEventListener("pointerdown", go);
            addEventListener("keydown", go, true);
          }, 600);
        }, 300);
      }

      function start(game, g) {     // game = { data: Uint8Array, name: "My Game.cso" }
        document.title = g.title + " - Fruti";
        stage.innerHTML = "";
        window.EJS_player = "#game";
        window.EJS_core = g.console;
        // The game's bytes go straight to the emulator (no copy). With raw bytes the emulator takes the
        // file name from EJS_gameName, so that's the real file name (the PSP emulator needs ".cso" etc.).
        window.EJS_gameName = game.name;
        window.EJS_gameUrl = game.data;
        window.EJS_CacheLimit = 0;              // don't also save a copy of the game in browser storage (never read back here; costs memory)
        window.EJS_pathtodata = "emulatorjs/data/";
        // ?v= makes browsers fetch emulator.js again after Fruti changes it (it has Fruti memory fixes)
        window.EJS_paths = { "compression.js": "emulatorjs/fruti-compression.js", "emulator.js": "emulatorjs/data/src/emulator.js?v=fruti3" };
        window.EJS_DEBUG_XX = true;             // load the non-minified scripts we ship
        window.EJS_startOnLoaded = true;
        window.EJS_threads = g.console === "psp"; // PSP (PPSSPP) needs threads; sw.js makes them possible
        if (g.console === "psp") window.EJS_VirtualGamepadSettings = PSP_TOUCH;
        window.EJS_defaultControls = controlsFor(g.console);
        window.EJS_color = "#29b6f6";
        loadScript("emulatorjs/data/loader.js");
        // Once the emulator has its own copy of the game, let the downloaded copy go (frees memory)
        var release = setInterval(function () {
          var emu = window.EJS_emulator;
          if (emu && (emu.started || emu.failedToStart)) { clearInterval(release); window.EJS_gameUrl = null; game = null; }
        }, 1000);
        watchEmulatorProgress();
        backButtonWhilePlaying();
        askForClickIfNeeded(g);
        setUpControls(g);
        explainFailure(g);
        trackTime(g.id);
      }

      // Save play time (read by the launcher tab)
      function trackTime(gid) {
        var last = Date.now();
        function save() {
          var now = Date.now(), add = now - last; last = now;
          try {
            var t = JSON.parse(localStorage.getItem("fruti:times") || "{}");
            t[gid] = (t[gid] || 0) + add;
            localStorage.setItem("fruti:times", JSON.stringify(t));
          } catch (e) {}
        }
        setInterval(function () { if (!document.hidden) save(); }, 15000);
        addEventListener("pagehide", save);
        document.addEventListener("visibilitychange", function () { if (document.hidden) save(); else last = Date.now(); });
      }

      // PSP games need multi-threading (SharedArrayBuffer), which needs a cross-origin isolated page.
      // On GitHub Pages sw.js provides that: install it, then reload once so it takes effect.
      function pspReady(g) {
        var key = "fruti:psp-reload:" + id;
        if (window.crossOriginIsolated && typeof SharedArrayBuffer === "function") { sessionStorage.removeItem(key); return true; }
        if (location.protocol === "file:" || !("serviceWorker" in navigator) || !window.isSecureContext) {
          show(g.title, "PSP games only play on the website (GitHub Pages), not when index.html is opened from your computer.");
          return false;
        }
        if (sessionStorage.getItem(key)) {
          sessionStorage.removeItem(key);
          show(g.title, "This browser can't run PSP games. Try a recent Chrome, Edge or Firefox on a computer.");
          return false;
        }
        show(g.title, "Getting the PSP emulator ready…");
        navigator.serviceWorker.register("sw.js").then(function () { return navigator.serviceWorker.ready; }).then(function () {
          sessionStorage.setItem(key, "1");
          location.reload();
        }).catch(function () {
          show(g.title, "This browser can't run PSP games. Try a recent Chrome, Edge or Firefox on a computer.");
        });
        return false;
      }

      if (!id) { show("No game selected."); return; }
      FrutiLibrary.load().then(function (games) {
        var g = games.filter(function (x) { return x.id === id; })[0];
        if (!g) { show("This game is not in the library."); return; }
        document.title = g.title + " - Fruti";
        if (g.image) { var l = document.createElement("link"); l.rel = "icon"; l.href = g.image; document.head.appendChild(l); }
        if (g.unsupported) { show(g.title, g.consoleFolder + " games can't be played yet."); return; }
        if (g.problem) { show(g.title, g.problem); return; }
        show(g.title, "Checking the game files…");
        FrutiLibrary.checkParts(g).then(function (missing) {
          if (missing) { show(g.title, missing); return; }
          if (g.console === "psp" && !pspReady(g)) return;
          downloadAndStart(g);
        });
      }).catch(function (e) {
        show("Couldn't load the game list from GitHub.", e.message);
      });

      function downloadAndStart(g) {
        stage.innerHTML = '<div class="msg"><b></b><div class="bar"><i></i></div><span></span><span class="eta"></span></div>';
        stage.querySelector("b").textContent = g.title;
        var bar = stage.querySelector(".bar i"), txt = stage.querySelector("span"), eta = stage.querySelector(".eta");
        var parts = g.files.length > 1 ? " (" + g.files.length + " parts)" : "";
        var est = Eta(), shown = 0;
        txt.textContent = "Downloading" + parts + "…";
        FrutiLibrary.download(g, function (done, total) {
          if (total) bar.style.width = Math.min(100, done / total * 100) + "%";
          txt.textContent = "Downloading" + parts + " " + mb(done) + (total ? " of " + mb(total) : "");
          var left = total ? est(done / total) : "";
          if (performance.now() - shown > 400) { eta.textContent = left; shown = performance.now(); }  // calm updates
        }).then(function (file) { eta.textContent = ""; txt.textContent = "Starting…"; start(file, g); })
          .catch(function (e) { show(g.title, /^Only \d|incomplete/.test(e.message) ? e.message : "Download failed. " + e.message); });
      }
    })();
  </script>
</body>
