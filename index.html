<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fruti Emulr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329b6f6'/%3E%3Cpath d='M11 9h11v3.5h-7v3h6v3.5h-6V24h-4z' fill='%230f1218'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts.css?v=1">
  <link rel="stylesheet" href="desktop.css?v=17">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">FRUTI</div>
      <label class="search" title="Search all games ( / )">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Search games" autocomplete="off">
      </label>
      <div class="tb-right">
        <button class="tb-btn" id="reload" title="Check GitHub for new games">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
        <span class="clock" id="clock">--:--</span>
      </div>
    </header>

    <nav class="consoles" id="consoles" aria-label="Consoles"></nav>

    <main class="shelf" id="shelf" aria-live="polite"></main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="consoles.js?v=5"></script>
  <script src="games.js?v=10"></script>
  <script src="library.js?v=17"></script>
  <script src="desktop.js?v=16"></script>
</body>
</html>
