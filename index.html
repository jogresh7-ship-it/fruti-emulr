<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fruti Emulr</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffffff'/%3E%3Cpath d='M11 9h11v3.5h-7v3h6v3.5h-6V24h-4z' fill='%23151515'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="fonts.css?v=1">
  <link rel="stylesheet" href="desktop.css?v=22">
</head>
<body>
  <div class="app">
    <!-- Sidebar: menu + the whole library -->
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span class="sb-logo">F</span>
        <span class="sb-name">FRUTI</span>
      </div>
      <nav class="sb-menu">
        <button class="sb-link" data-page="home">
          <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span>
        </button>
        <button class="sb-link" data-page="catalogue">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Catalogue</span>
        </button>
      </nav>
      <div class="sb-section">
        <div class="sb-title">My library <span id="sb-count"></span></div>
        <label class="sb-filter">
          <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
          <input id="sb-filter" type="search" placeholder="Filter library" autocomplete="off">
        </label>
        <div class="sb-list" id="sb-list"></div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Top bar -->
    <header class="header">
      <button class="hd-menu" id="hd-menu" aria-label="Open the library">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 class="hd-title" id="hd-title">Home</h1>
      <div class="hd-right">
        <label class="hd-search" title="Search all games ( / )">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="Search games" autocomplete="off">
        </label>
        <button class="hd-btn" id="reload" title="Check GitHub for new games">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="content" aria-live="polite"></main>

    <!-- Bottom status bar -->
    <footer class="statusbar">
      <span id="status-left">Loading games…</span>
      <span id="status-right"></span>
    </footer>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="consoles.js?v=13"></script>
  <script src="games.js?v=10"></script>
  <script src="library.js?v=18"></script>
  <script src="desktop.js?v=21"></script>
</body>
</html>
